# Example deployment configuration for Streamlit app
# Copy this file to deploy.local.yaml and fill in your actual values
# NEVER commit deploy.local.yaml or deploy.prod.yaml to git

server:
  host: your-server.com           # Your server IP or hostname
  user: ubuntu                     # SSH username
  remote_path: /opt/apps/myapp    # Remote directory path
  port: 22                         # SSH port
  key_file: ~/.ssh/id_rsa         # Path to your SSH private key (optional)
  # password: your-password        # SSH password (not recommended, use key_file instead)

app:
  type: streamlit
  port: 8501                       # Port for Streamlit to listen on
  name: streamlit-dashboard        # Service name (used for systemd)
  python_version: python3          # Python command on remote server
  requirements_file: requirements.txt

  # Environment variables to pass to your application
  environment_vars:
    # Add any secrets or config your app needs:
    # DATABASE_URL: postgresql://user:password@host/db
    # API_KEY: your-api-key
    # STREAMLIT_SERVER_HEADLESS: "true"
    # STREAMLIT_SERVER_ENABLE_CORS: "false"

# Usage:
# 1. Copy this file: cp deploy.example.yaml deploy.local.yaml
# 2. Edit deploy.local.yaml with your actual credentials
# 3. Deploy: app-publisher deploy . --config deploy.local.yaml
